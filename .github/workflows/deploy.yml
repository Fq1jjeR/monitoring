name: CI/CD
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push sim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sim/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/monitoring-sim:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy stack and run tests
        env:
          REGISTRY: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          docker stack deploy -c docker-compose.yaml monitoring
          for i in $(seq 1 30); do
            PROXY_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker ps -q -f name=monitoring_proxy)" 2>/dev/null | head -n 1)
            if [ -n "$PROXY_IP" ] && curl -sf --max-time 5 "http://$PROXY_IP/" >/dev/null; then
              echo "Proxy is up at $PROXY_IP"
              break
            fi
            sleep 10
          done
          for s in db server web snmptraps sim proxy; do
            if [ -z "$(docker ps -q -f name=monitoring_${s})" ]; then
              echo "Error: $s is not running"
              docker service ls
              docker service ps monitoring_${s} --no-trunc
              exit 1
            fi
          done
          PROXY_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker ps -q -f name=monitoring_proxy)")
          echo "Control request to proxy at $PROXY_IP"
          curl -f --max-time 15 "http://$PROXY_IP/"
          docker stack rm monitoring
          sleep 10
          docker volume rm $(docker volume ls -q -f name=monitoring) || true
          docker swarm leave --force
      - name: Cleanup on failure
        if: always()
        run: |
          docker stack rm monitoring || true
          docker swarm leave --force || true
