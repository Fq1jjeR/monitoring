name: CI/CD
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push sim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sim/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/monitoring-sim:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy stack and run tests
        env:
          REGISTRY: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          docker stack deploy -c docker-compose.yaml monitoring
          for i in $(seq 1 30); do curl -sf http://localhost/ >/dev/null && break; sleep 10; done
          for s in db server web snmptraps sim grafana proxy; do
            if [ -z "$(docker ps -q -f name=monitoring_${s})" ]; then
              echo "Error: $s is not running"
              docker service ls
              docker stack rm monitoring
              exit 1
            fi
          done
          curl -f http://localhost/ || {
            echo "Error: proxy not accessible"
            docker stack rm monitoring
            exit 1; }
          curl -f http://localhost/grafana/ || {
            echo "Error: grafana not accessible"
            docker stack rm monitoring
            exit 1; }
          docker stack rm monitoring
          docker volume rm $(docker volume ls -q -f name=monitoring)
          docker swarm leave --force
